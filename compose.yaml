services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command:
      - celery
      - -A
      - ml_platform.celery_app
      - worker
      - --loglevel=INFO
      - --events
      - --concurrency=1
      - --queues=celery
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  worker-beat:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command:
      - celery
      - -A
      - ml_platform.celery_app
      - worker
      - --loglevel=INFO
      - --events
      - --concurrency=1
      - --queues=beat
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command:
      - celery
      - -A
      - ml_platform.celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/data/celerybeat-schedule
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - beat_data:/data
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  producer:
    build:
      context: .
      dockerfile: docker/producer.Dockerfile
    command:
      - uvicorn
      - ml_platform.producer:app
      - --host=0.0.0.0
      - --port=8000
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:2.1.0
    command:
      - celery
      - --broker=redis://redis:6379/0
      - flower
      - --address=0.0.0.0
      - --port=5555
      - --persistent=True
      - --db=/data/flower.db
    ports:
      - "5555:5555"
    volumes:
      - flower_data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  beat_data:
  flower_data:
  redis_data:
