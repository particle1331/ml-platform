services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --blobPort
      - "10000"
      - --location
      - /data
      - --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite_data:/data
    restart: unless-stopped

  azurite-init:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    volumes:
      - ./scripts/init_azurite.py:/scripts/init_azurite.py:ro
    command:
      - python
      - /scripts/init_azurite.py
    environment:
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    depends_on:
      azurite:
        condition: service_started
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --backend-store-uri
      - postgresql://mlflow:mlflow@postgres:5432/mlflow
      - --artifacts-destination
      - wasbs://mlflow-artifacts@devstoreaccount1.blob.core.windows.net
      - --serve-artifacts
      - --allowed-hosts
      - localhost:5000,127.0.0.1:5000,mlflow:5000
    environment:
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      azurite-init:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command:
      - celery
      - -A
      - ml_platform.celery_app
      - worker
      - --loglevel=INFO
      - --events
      - --concurrency=1
      - --queues=default
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  worker-beat:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command:
      - celery
      - -A
      - ml_platform.celery_app
      - worker
      - --loglevel=INFO
      - --events
      - --concurrency=1
      - --queues=beat
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command:
      - celery
      - -A
      - ml_platform.celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/data/celerybeat-schedule
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - beat_data:/data
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  producer:
    build:
      context: .
      dockerfile: docker/producer.Dockerfile
    command:
      - uvicorn
      - ml_platform.producer:app
      - --host=0.0.0.0
      - --port=18000
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # The /ui Flet app reads the producer's own HTTP API from inside the
      # container, where uvicorn listens on 18000.
      ML_PLATFORM_API_URL: http://127.0.0.1:18000
    ports:
      - "127.0.0.1:18000:18000"
    depends_on:
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:2.1.0
    command:
      - celery
      - --broker=redis://redis:6379/0
      - flower
      - --address=0.0.0.0
      - --port=5555
      - --persistent=True
      - --db=/data/flower.db
    ports:
      - "5555:5555"
    volumes:
      - flower_data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  azurite_data:
  beat_data:
  flower_data:
  mlflow_postgres_data:
  redis_data:
