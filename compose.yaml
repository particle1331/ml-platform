services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: platform
      RABBITMQ_DEFAULT_PASS: platform
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      CELERY_BROKER_URL: amqp://platform:platform@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:2.1.0
    command:
      - celery
      - --broker=amqp://platform:platform@rabbitmq:5672//
      - flower
      - --address=0.0.0.0
      - --port=5555
      - --persistent=True
      - --db=/data/flower.db
    ports:
      - "5555:5555"
    volumes:
      - flower_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  flower_data:
  rabbitmq_data:
  redis_data:
