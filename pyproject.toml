[project]
name = "ml-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "particle", email = "54845098+particle1331@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "celery[redis]==5.6.3",
    "fastapi>=0.115,<1",
    "flet[web]==1.0.3",
    "flower==2.1.0",
    "httpx>=0.27,<1",
    "mlflow==3.16.0",
    "openai>=1,<3",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.6,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
ml-platform = "ml_platform:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
